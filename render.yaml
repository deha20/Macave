databases:
  - name: macave-db
    plan: free
    databaseName: macave
    user: macave_user

services:
  - type: web
    plan: free
    name: macave
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn ApplicationGestionCave.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: macave-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.10.0"
